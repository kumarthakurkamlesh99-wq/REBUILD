name: Build Android Debug APK

# Controls when the workflow will run
on:
  # Triggers the workflow on push events targeting default branches
  push:
    branches:
      - main
      - master
  # Triggers the workflow on pull request events targeting default branches
  pull_request:
    branches:
      - main
      - master
  # Allows manual triggering of the workflow from the GitHub Actions tab
  workflow_dispatch:

# Concurrency to cancel outdated in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up Android SDK and build tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Step 4: Setup Gradle with build caching enabled
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      # Step 5: Ensure Gradle wrapper script has executable permissions
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Step 6: Build the Android Debug APK and output detailed logs
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --info

      # Step 7: Upload generated Debug APK as an artifact
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
