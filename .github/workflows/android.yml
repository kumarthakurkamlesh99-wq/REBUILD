name: Android Debug APK CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Accept Licenses
        run: |
          echo "Configuring Android SDK from pre-installed runner environment..."
          export ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          
          # Automatically accept all Android SDK licenses non-interactively
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          
          # Install and verify required platform tools and Android 36 platform
          sdkmanager --install "platform-tools" "platforms;android-36" || true

      - name: Prepare Build Environment & Keystore
        run: |
          echo "Preparing environment files..."
          # Secrets Gradle Plugin requires .env to exist
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

          # Ensure debug.keystore exists for signingConfig.debugConfig
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating default debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant execute permission to Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle wrapper files..."
            gradle wrapper || true
          fi
          chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK Output
        run: |
          if compgen -G "app/build/outputs/apk/debug/*.apk" > /dev/null; then
            echo "Debug APK successfully created:"
            ls -lh app/build/outputs/apk/debug/*.apk
          else
            echo "Error: No debug APK generated in app/build/outputs/apk/debug/"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
